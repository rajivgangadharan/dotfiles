"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$golang\
$python\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 1000

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "yellow"

[golang]
format = "[$symbol($version )]($style)"
symbol = " "
style = "cyan"

[python]
format = '[$symbol($version )(\($virtualenv\) )]($style)'
symbol = " "
style = "yellow"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style)"
style = "dimmed yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
