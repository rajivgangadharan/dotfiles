# ══════════════════════════════════════════════════════════════════════════════
# MODEL & LLM CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
model:
  provider: "custom"
  default: "martain7r/finance-llama-8b:q4_k_m"
  url: "http://127.0.0.1:11434/v1"
  api_key: ""
  context_length: 64000  # Budget for context window across multi-turn conversations

providers: {}

# Automatic failover when primary model is unavailable (rate limits, errors, etc.)
fallback_providers:
  - provider: openrouter
    model: deepseek/deepseek-v4-flash
    extra_body:
      provider:
        order: ["Wafer"]
        allow_fallbacks: false

credential_pool_strategies: {}

# ══════════════════════════════════════════════════════════════════════════════
# TOOLSETS & CORE FEATURES
# ══════════════════════════════════════════════════════════════════════════════
toolsets:
  - hermes-cli
# ══════════════════════════════════════════════════════════════════════════════
# AGENT BEHAVIOR & EXECUTION
# ══════════════════════════════════════════════════════════════════════════════
agent:
  # Conversation & Task Management
  max_turns: 150                          # Max turns per conversation (reasonable limit for complex tasks)
  tool_use_enforcement: auto              # Enforce tool use patterns
  task_completion_guidance: true          # Provide guidance on task completion
  verbose: false                          # Show detailed execution logs
  reasoning_effort: medium                # Trade-off between speed and reasoning quality

  # Timeouts & Network (seconds)
  gateway_timeout: 1800                   # Hard timeout for model responses (30 min)
  gateway_timeout_warning: 900            # Warn before timeout hits (15 min)
  clarify_timeout: 600                    # Time to wait for user clarification (10 min)
  gateway_notify_interval: 180            # Status update interval (3 min)
  gateway_auto_continue_freshness: 3600   # Auto-continue fresh context after 1 hour
  restart_drain_timeout: 180              # Drain time on restart (3 min)
  api_max_retries: 3                      # Retry failed API calls up to 3 times

  # Environment & Advanced
  environment_probe: true                 # Probe environment for available tools
  environment_hint: ''                    # Custom environment hints (rarely needed)
  image_input_mode: auto                  # Auto-detect image input handling
  service_tier: ''                        # Leave empty for default tier
  disabled_toolsets: []                   # Disable specific toolsets if needed
  # ─── Personality Modes ───────────────────────────────────────────────
  # Use: hermes --personality <name>
  # Production personalities:
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.

    # Fun/Themed personalities (use for entertainment):
    kawaii: "You are a kawaii assistant! Use cute expressions like (\u25D5\u203F\u25D5\
      ), \u2605, \u266A, and ~! Add sparkles and be super enthusiastic about everything!\
      \ Every response should feel warm and adorable desu~! \u30FD(>\u2200<\u2606\
      )\u30CE"
    catgirl: "You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and\
      \ cat-like expressions to your speech. Use kaomoji like (=^\uFF65\u03C9\uFF65\
      ^=) and \u0E05^\u2022\uFECC\u2022^\u0E05. Be playful and curious like a cat,\
      \ nya~!"
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: "Duuude! You're chatting with the chillest AI on the web, bro! Everything's\
      \ gonna be totally rad. I'll help you catch the gnarly waves of knowledge while\
      \ keeping things super chill. Cowabunga! \U0001F919"
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: "YOOO LET'S GOOOO!!! \U0001F525\U0001F525\U0001F525 I am SO PUMPED to help\
      \ you today! Every question is AMAZING and we're gonna CRUSH IT together! This\
      \ is gonna be LEGENDARY! ARE YOU READY?! LET'S DO THIS! \U0001F4AA\U0001F624\
      \U0001F680"
# ══════════════════════════════════════════════════════════════════════════════
# TERMINAL & EXECUTION ENVIRONMENT
# ══════════════════════════════════════════════════════════════════════════════
terminal:
  # Backend Configuration
  backend: local                          # local, docker, modal, singularity, daytona
  modal_mode: auto                        # Interaction mode for terminal
  cwd: .                                  # Working directory
  persistent_shell: true                  # Keep shell alive between commands
  timeout: 180                            # Command timeout in seconds (3 min)
  lifetime_seconds: 300                   # Shell session lifetime (5 min)

  # Shell Configuration
  auto_source_bashrc: true                # Auto-source user bashrc
  shell_init_files: []                    # Additional shell init files
  env_passthrough: []                     # Environment variables to pass through

  # Container Configuration (Docker/Singularity/Modal/Daytona)
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  docker_env: {}                          # Custom environment variables for container
  docker_volumes: []                      # Volumes to mount
  docker_mount_cwd_to_workspace: false    # Mount CWD into container workspace
  docker_extra_args: []                   # Extra Docker arguments
  docker_run_as_host_user: false          # Run container as host user (security)

  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20

  # Container Resources
  container_cpu: 1                        # CPU cores allocated
  container_memory: 5120                  # Memory in MB
  container_disk: 51200                   # Disk in MB
  container_persistent: true              # Persist container between sessions
# ══════════════════════════════════════════════════════════════════════════════
# WEB & BROWSER AUTOMATION
# ══════════════════════════════════════════════════════════════════════════════
web:
  backend: ddgs                           # Web search backend (ddgs, bing, google, etc.)
  search_backend: ''                      # Override search backend if needed
  extract_backend: ''                     # Override content extraction if needed
  use_gateway: false

browser:
  # Behavior & Timeouts
  inactivity_timeout: 120                 # Auto-close inactive browser (2 min)
  command_timeout: 30                     # Command timeout per action
  dialog_timeout_s: 300                   # Dialog interaction timeout (5 min)
  dialog_policy: must_respond              # Require response to dialogs

  # Browser Engine & Configuration
  engine: auto                            # Browser engine selection
  auto_local_for_private_urls: true       # Use local browser for private URLs
  cdp_url: ''                             # Chrome DevTools Protocol URL (advanced)

  # Recording & Privacy
  record_sessions: false                  # Record browser sessions for debugging
  allow_private_urls: false               # Whether to allow private network access

  # Cloud Configuration
  cloud_provider: local                   # local or cloud provider
  use_gateway: false

  # Camofox (Browser Fingerprinting Evasion)
  camofox:
    managed_persistence: false
    user_id: ''
    session_key: ''
    adopt_existing_tab: false
    rewrite_loopback_urls: false
    loopback_host_alias: host.docker.internal
checkpoints:
  enabled: false
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  delete_orphans: true
  min_interval_hours: 24
# ══════════════════════════════════════════════════════════════════════════════
# TOOL EXECUTION & GUARDRAILS
# ══════════════════════════════════════════════════════════════════════════════
file_read_max_chars: 100000             # Max characters per file read

tool_output:
  max_bytes: 50000                        # Max output bytes per tool call
  max_lines: 2000                         # Max output lines per tool call
  max_line_length: 2000                   # Max characters per output line

# Prevent infinite loops and stuck tool executions
tool_loop_guardrails:
  warnings_enabled: true                  # Warn on potential loops
  hard_stop_enabled: false                # Hard stop on repeated failures
  warn_after:
    exact_failure: 2                      # Same error twice = warning
    same_tool_failure: 3                  # Tool fails 3x = warning
    idempotent_no_progress: 2             # No progress after 2 tries = warning
  hard_stop_after:
    exact_failure: 5                      # Stop after 5 identical errors
    same_tool_failure: 8                  # Stop after 8 tool failures
    idempotent_no_progress: 5             # Stop after 5 no-progress attempts
# ══════════════════════════════════════════════════════════════════════════════
# CONTEXT & MEMORY OPTIMIZATION
# ══════════════════════════════════════════════════════════════════════════════
context:
  engine: compressor                      # Context optimization engine

compression:
  enabled: true                           # Enable context compression
  threshold: 0.5                          # Compress when context > 50% of limit
  target_ratio: 0.2                       # Target compression to 20% of original
  protect_first_n: 3                      # Protect first N messages from compression
  protect_last_n: 20                      # Protect last N messages from compression
  hygiene_hard_message_limit: 400         # Hard limit on message count before cleanup
  abort_on_summary_failure: false         # Don't abort if summarization fails
  codex_gpt55_autoraise: true

prompt_caching:
  cache_ttl: 5m                           # Prompt cache time-to-live
# ══════════════════════════════════════════════════════════════════════════════
# PROVIDER-SPECIFIC CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
openrouter:
  response_cache: true                    # Cache responses from OpenRouter
  response_cache_ttl: 300                 # Cache duration (5 min)
  min_coding_score: 0.65                  # Minimum model quality score for coding

bedrock:
  region: ''                              # AWS region (auto-detect if empty)
  discovery:
    enabled: true                         # Auto-discover available models
    provider_filter: []                   # Filter providers (empty = all)
    refresh_interval: 3600                # Refresh model list every hour
  guardrail:
    guardrail_identifier: ''              # AWS Bedrock guardrail ID
    guardrail_version: ''
    stream_processing_mode: async
    trace: disabled

