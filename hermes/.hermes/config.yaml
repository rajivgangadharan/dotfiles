# ══════════════════════════════════════════════════════════════════════════════
# DISPLAY & UI CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
display:
  # Appearance
  interface: cli                          # cli or tui (terminal user interface)
  skin: default                           # UI theme
  language: en
  compact: false                          # Compact output mode
  tui_status_indicator: kaomoji           # Status indicator style

  # Personality & Messaging
  personality: ''                         # Default personality (empty = helpful)
  interim_assistant_messages: true        # Show intermediate responses
  bell_on_complete: false                 # Ring bell when task completes

  # Resume Display (conversation continuation)
  resume_display: full                    # How to show resumed conversations
  resume_exchanges: 10                    # Recent exchanges to show on resume
  resume_max_user_chars: 300              # Max chars per user message in resume
  resume_max_assistant_chars: 200         # Max chars per assistant message
  resume_max_assistant_lines: 3           # Max lines per assistant message
  resume_skip_tool_only: true             # Skip tool-only exchanges

  # Streaming & Output
  streaming: true                         # Stream responses as they arrive
  timestamps: false                       # Show message timestamps
  show_reasoning: false                   # Show model reasoning (if extended thinking)
  show_cost: false                        # Display token costs

  # Response Formatting
  final_response_markdown: strip          # How to format final markdown
  persistent_output: true                 # Keep output on screen
  persistent_output_max_lines: 200        # Max lines of persistent output
  inline_diffs: true                      # Show diffs inline

  # Tool Progress & Feedback
  tool_progress: all                      # Show all tool progress
  tool_progress_command: false            # Include command in tool progress
  tool_progress_overrides: {}
  tool_preview_length: 0                  # Preview length for tool output
  cleanup_progress: false                 # Show cleanup progress

  # User Experience
  busy_input_mode: interrupt              # How to handle input while busy
  busy_ack_detail: true                   # Show details in busy acknowledgments
  long_running_notifications: true        # Notify on long operations
  background_process_notifications: all   # Notify on background processes
  copy_shortcut: auto                     # Auto-detect copy shortcut
  tui_auto_resume_recent: false
  tui_agents_nudge: true

  # Verification & Explanation
  file_mutation_verifier: true            # Verify file changes
  turn_completion_explainer: true         # Explain how turns completed

  # Advanced
  ephemeral_system_ttl: 0                 # System message TTL

  # Platform-Specific Display Settings
  platforms:
    telegram:
      streaming: true                     # Stream on Telegram
    discord:
      streaming: false                    # Don't stream on Discord

  # Runtime Footer
  runtime_footer:
    enabled: false
    fields:
      - model
      - context_pct
      - cwd
dashboard:
  theme: default
  show_token_analytics: false
  oauth:
    client_id: ''
    portal_url: ''
  basic_auth:
    username: ''
    password_hash: ''
    password: ''
    secret: ''
    session_ttl_seconds: 0
  public_url: ''
privacy:
  redact_pii: false
# ══════════════════════════════════════════════════════════════════════════════
# VOICE INTERACTION (TEXT-TO-SPEECH, SPEECH-TO-TEXT)
# ══════════════════════════════════════════════════════════════════════════════
tts:
  provider: gemini                        # TTS provider (gemini, openai, elevenlabs, etc.)
  edge:
    voice: en-US-AriaNeural
  elevenlabs:
    voice_id: pNInz6obpgDQGcFmaJgB
    model_id: eleven_multilingual_v2
  openai:
    model: gpt-4o-mini-tts
    voice: alloy
  xai:
    voice_id: eve
    language: en
    sample_rate: 24000
    bit_rate: 128000
  mistral:
    model: voxtral-mini-tts-2603
    voice_id: c69964a6-ab8b-4f8a-9465-ec0925096ec8
  neutts:
    ref_audio: ''
    ref_text: ''
    model: neuphonic/neutts-air-q4-gguf
    device: cpu
  piper:
    voice: en_US-lessac-medium
  use_gateway: false
stt:
  enabled: true                           # Enable speech-to-text
  provider: local                         # STT provider (local, openai, mistral, etc.)
  local:
    model: base                           # Whisper model size
    language: ''                          # Auto-detect if empty
  openai:
    model: whisper-1
  mistral:
    model: voxtral-mini-latest
  elevenlabs:
    model_id: scribe_v2
    language_code: ''
    tag_audio_events: false
    diarize: false                        # Speaker diarization

voice:
  record_key: ctrl+b                      # Hotkey to start voice recording
  max_recording_seconds: 120              # Max recording length (2 min)
  beep_enabled: true                      # Beep on record start/stop
  silence_threshold: 200                  # Silence detection threshold
  silence_duration: 3.0                   # Silence duration to trigger end
  auto_tts: false                         # Automatically play TTS responses

# Artificial delay for human-like response timing (mostly for fun)
human_delay:
  mode: 'off'                             # on, off, or random
  min_ms: 800
  max_ms: 2500
# ══════════════════════════════════════════════════════════════════════════════
# MEMORY & USER PROFILES
# ══════════════════════════════════════════════════════════════════════════════
memory:
  memory_enabled: true                    # Enable conversation memory
  user_profile_enabled: true              # Enable user profile learning
  provider: ''                            # Memory backend (empty = default)
  memory_char_limit: 2200                 # Max chars for conversation memory
  user_char_limit: 1375                   # Max chars for user profile
  nudge_interval: 10                      # Remind to update memory every N turns
  flush_min_turns: 6                      # Flush memory after N turns

# ══════════════════════════════════════════════════════════════════════════════
# DELEGATION & MULTI-AGENT ORCHESTRATION
# ══════════════════════════════════════════════════════════════════════════════
delegation:
  # Model for delegated tasks
  model: ''                               # Empty = use primary model
  provider: ''
  base_url: ''
  api_key: ''
  api_mode: ''

  # Behavior
  inherit_mcp_toolsets: true              # Child agents inherit parent tools
  subagent_auto_approve: false            # Auto-approve delegated tasks
  orchestrator_enabled: true              # Enable task orchestration

  # Limits & Timeouts
  max_iterations: 50                      # Max iterations per delegated task
  child_timeout_seconds: 600              # Timeout for child agents (10 min)
  max_concurrent_children: 3              # Max parallel delegations
  max_spawn_depth: 1                      # Max nesting depth for delegation
  reasoning_effort: ''                    # Override reasoning effort
# ══════════════════════════════════════════════════════════════════════════════
# GOAL TRACKING, SKILLS & SESSION MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════
prefill_messages_file: ''                 # Pre-populate session with messages

goals:
  max_turns: 20                           # Max turns for goal-based tasks

skills:
  external_dirs: []                       # Additional skill directories
  template_vars: true                     # Allow template variables in skills
  inline_shell: false                     # Execute shell inline in skills
  inline_shell_timeout: 10                # Timeout for inline shell
  guard_agent_created: false              # Guard agent creation
  creation_nudge_interval: 15             # Prompt to create skills every N turns

curator:
  enabled: true                           # Auto-organize sessions & conversations
  interval_hours: 168                     # Curation interval (1 week)
  min_idle_hours: 2                       # Minimum idle time before curation
  stale_after_days: 30                    # Mark sessions as stale after 30 days
  archive_after_days: 90                  # Archive sessions after 90 days
  prune_builtins: true                    # Remove default/built-in sessions
  backup:
    enabled: true                         # Backup before curation
    keep: 5                               # Keep 5 backup versions

timezone: ''                              # Override timezone (empty = auto-detect)
# ══════════════════════════════════════════════════════════════════════════════
# PLATFORM INTEGRATIONS (Slack, Discord, Telegram, etc.)
# ══════════════════════════════════════════════════════════════════════════════
slack:
  require_mention: true                   # Require @mention to respond
  free_response_channels: ''              # Channels for free (unprompted) responses
  allowed_channels: ''                    # Restrict to specific channels
  channel_prompts: {}                     # Channel-specific prompts

discord:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  auto_thread: true                       # Auto-create threads for responses
  thread_require_mention: false
  history_backfill: true                  # Backfill conversation history
  history_backfill_limit: 50
  reactions: true                         # React with emojis
  channel_prompts: {}
  dm_role_auth_guild: ''                  # Guild for DM role-based auth
  server_actions: ''
  allow_any_attachment: false
  max_attachment_bytes: 33554432          # Max attachment size (32 MB)
  voice_fx:
    enabled: false                        # Discord voice effects
    ambient_enabled: true                 # Ambient sound
    ambient_path: ''                      # Custom ambient audio path
    ambient_gain: 0.18
    duck_gain: 0.06
    speech_gain: 1.0
    ack_enabled: true
    ack_phrases:
      - Let me look into that.
      - One moment.
      - Checking on that now.
      - Give me a sec.
      - On it.

whatsapp: {}                              # No additional config needed

telegram:
  reactions: false
  channel_prompts: {}
  allowed_chats: ''

mattermost:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  channel_prompts: {}

matrix:
  require_mention: true
  free_response_rooms: ''
  allowed_rooms: ''
# ══════════════════════════════════════════════════════════════════════════════
# APPROVALS, SECURITY & PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
approvals:
  mode: manual                            # manual or automatic
  timeout: 60                             # Approval request timeout
  cron_mode: deny                         # Require approval for cron jobs
  mcp_reload_confirm: true                # Confirm MCP server reloads
  destructive_slash_confirm: true         # Confirm destructive commands

security:
  # Network & URL Security
  allow_private_urls: false               # Allow access to private networks
  redact_secrets: true                    # Automatically redact secrets from output

  # Tirith Security Scanner
  tirith_enabled: true                    # Enable Tirith vulnerability scanning
  tirith_path: tirith                     # Tirith binary path
  tirith_timeout: 5                       # Scan timeout (seconds)
  tirith_fail_open: true                  # Continue if scan fails

  # Website Blocklist
  website_blocklist:
    enabled: false
    domains: []                           # Blocked domains
    shared_files: []                      # Shared blocklists

  # Advisory Management
  acked_advisories: []                    # Acknowledged security advisories
  allow_lazy_installs: true               # Allow lazy tool installation

command_allowlist: []                     # Restrict to specific commands (if set)
quick_commands: {}                        # Quick command shortcuts
hooks: {}                                 # Custom hooks (if any)
hooks_auto_accept: false                  # Auto-accept hook outputs
# ══════════════════════════════════════════════════════════════════════════════
# AUTOMATION & TASK MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════
cron:
  wrap_response: true                     # Wrap cron job responses
  max_parallel_jobs: null                 # Concurrent job limit (null = unlimited)

kanban:
  dispatch_in_gateway: true               # Dispatch through gateway
  dispatch_interval_seconds: 60           # Check interval
  failure_limit: 2                        # Fail after N errors
  auto_decompose: true                    # Auto-decompose complex tasks
  auto_decompose_per_tick: 3              # Tasks to decompose per cycle
  orchestrator_profile: ''
  default_assignee: ''
  max_in_progress_per_profile: null       # Max concurrent per profile
  dispatch_stale_timeout_seconds: 14400   # Stale task timeout (4 hours)
  worker_log_rotate_bytes: 2097152        # Log rotation size
  worker_log_backup_count: 1              # Keep N backups

# ══════════════════════════════════════════════════════════════════════════════
# CODE EXECUTION & TOOL MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════
code_execution:
  mode: project                           # execution scope (project, sandbox, etc.)
  timeout: 300                            # Execution timeout (5 min)
  max_tool_calls: 50                      # Max tool calls per execution

tools:
  tool_search:
    enabled: auto                         # Auto-enable smart tool search
    threshold_pct: 10                     # Search when context fills 10%
    search_default_limit: 5               # Default tools to return
    max_search_limit: 20                  # Max tools to return

# ══════════════════════════════════════════════════════════════════════════════
# LOGGING & MONITORING
# ══════════════════════════════════════════════════════════════════════════════
logging:
  level: INFO                             # Log level (DEBUG, INFO, WARNING, ERROR)
  max_size_mb: 5                          # Individual log file size
  backup_count: 3                         # Number of backups to keep
# ══════════════════════════════════════════════════════════════════════════════
# MODEL CATALOG & NETWORK
# ══════════════════════════════════════════════════════════════════════════════
model_catalog:
  enabled: true                           # Enable model discovery/catalog
  url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json
  ttl_hours: 1                            # Cache catalog for 1 hour
  providers: {}

network:
  force_ipv4: false                       # Force IPv4 connections

# ══════════════════════════════════════════════════════════════════════════════
# GATEWAY & STREAMING
# ══════════════════════════════════════════════════════════════════════════════
gateway:
  strict: false                           # Strict gateway mode
  media_delivery_allow_dirs: []           # Allowed media directories
  trust_recent_files: true                # Trust recently accessed files
  trust_recent_files_seconds: 600         # Trust window (10 min)

streaming:
  enabled: false                          # Enable response streaming
  transport: auto                         # Transport method (auto, sse, ws)
  edit_interval: 0.8                      # Update interval for streaming
  buffer_threshold: 24                    # Buffer size threshold
  cursor: " ▉"                            # Streaming cursor character
  fresh_final_after_seconds: 60.0         # Show final response after 60s

# ══════════════════════════════════════════════════════════════════════════════
# SESSION MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════
sessions:
  auto_prune: false                       # Auto-prune old sessions
  retention_days: 90                      # Keep sessions for 90 days
  vacuum_after_prune: true                # Vacuum database after pruning
  min_interval_hours: 24                  # Minimum interval between prunes
  write_json_snapshots: false             # Write JSON session snapshots
# ══════════════════════════════════════════════════════════════════════════════
# ONBOARDING, UPDATES & MAINTENANCE
# ══════════════════════════════════════════════════════════════════════════════
onboarding:
  seen:
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
  profile_build: ask                      # ask, auto, or skip

updates:
  pre_update_backup: false                # Backup before updates
  backup_keep: 5                          # Keep N backups
  non_interactive_local_changes: stash    # Handle local changes (stash, keep)

# ══════════════════════════════════════════════════════════════════════════════
# LANGUAGE SERVERS & EXTERNAL INTEGRATIONS
# ══════════════════════════════════════════════════════════════════════════════
lsp:
  enabled: true                           # Enable Language Server Protocol
  wait_mode: document                     # When to initialize (document, always)
  wait_timeout: 5.0                       # Initialization timeout
  install_strategy: auto                  # auto or manual
  servers: {}                             # Custom LSP server configs

x_search:
  model: grok-4.20-reasoning              # Model for X/Twitter search
  timeout_seconds: 180                    # Search timeout
  retries: 2                              # Retry attempts

# ══════════════════════════════════════════════════════════════════════════════
# SECRETS & CREDENTIAL MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════
secrets:
  bitwarden:
    enabled: false                        # Enable Bitwarden secret management
    access_token_env: BWS_ACCESS_TOKEN
    project_id: ''
    cache_ttl_seconds: 300
    override_existing: true
    auto_install: true
    server_url: ''
  command:
    enabled: true
    command: "cat $HOME/.hermes/shared.env"

# ══════════════════════════════════════════════════════════════════════════════
# TEXT PASTING & SESSION CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
paste_collapse_threshold: 5               # Collapse pastes after N lines
paste_collapse_threshold_fallback: 5
paste_collapse_char_threshold: 2000       # Collapse pastes after N chars

session_reset:
  mode: none                              # none, idle, or at_hour
  idle_minutes: 1440                      # Reset after 24 hours idle
  at_hour: 4                              # Reset at 4 AM

group_sessions_per_user: true             # Group sessions by user

_config_version: 28

# ══════════════════════════════════════════════════════════════════════════════
# PLATFORM-SPECIFIC TOOLSETS
# ══════════════════════════════════════════════════════════════════════════════
platform_toolsets:
  # CLI Toolset (default for terminal usage)
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - messaging
    - moa
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
    - x_search
    - mcp-codegraph

  # Platform-Specific Toolsets
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat

known_plugin_toolsets:
  cli:
    - spotify

# ══════════════════════════════════════════════════════════════════════════════
# MODEL CONTROL PLANE (MCP) SERVERS
# ══════════════════════════════════════════════════════════════════════════════
# MCP servers provide access to tools and data sources via a standard protocol.
# Examples: CodeGraph (code search), file systems, APIs, etc.
mcp_servers:
  # CodeGraph: Fast code exploration and symbol lookup
  # Install: pip install codegraph
  # Docs: https://codebase-analyzer.dev/
  codegraph:
    command: codegraph
    args:
      - serve
      - --mcp
    timeout: 120
    connect_timeout: 60
    enabled: true

  # Add more MCP servers below as needed.
  # Example:
  #   myserver:
  #     command: myserver
  #     args: []
  #     timeout: 120
  #     connect_timeout: 60
  #     enabled: true

  alpha-analysis:
    command: /home/rajivg/Code/stock-trading/src/scripts/alpha_analysis_mcp_stdio.sh
    args: []
    timeout: 120
    connect_timeout: 60
    enabled: true
